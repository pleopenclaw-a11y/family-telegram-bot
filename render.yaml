services:
  - type: web
    name: family-board-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    disk:
      name: family-board-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FAMILY_BOARD_DB_PATH
        value: /var/data/family_memory.sqlite3
      - key: FAMILY_BOARD_API_TOKEN
        sync: false
      - key: FAMILY_BOARD_ALLOWED_ORIGIN
        sync: false
      - key: NINEARM_API_KEY
        sync: false
